name: Security gateway tests

on:
  push:
    branches:
      - security/ai-tool-execution-gateway
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Compile security gateway
        run: python -m py_compile mesh/security_gateway.py mesh/security_server.py tests/test_security_gateway.py tests/test_security_server.py
      - name: Run isolated adversarial and concurrency tests
        run: python -m pytest tests/test_security_gateway.py tests/test_security_server.py -q
